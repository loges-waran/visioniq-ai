services:
  # Backend API Service
  - type: web
    name: visioniq-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: FRONTEND_ORIGIN
        value: https://visioniq-ai.vercel.app
      - key: ENABLE_HISTORY_BY_DEFAULT
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./visioniq.db
      - key: PYTHONPATH
        value: .
